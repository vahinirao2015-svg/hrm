services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - /data/postgres:/var/lib/postgresql/data   # EBS-backed persistent volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/hrms
      DB_USER: hrms
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    ports: ["8081:8081"]
